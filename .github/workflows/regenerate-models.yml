name: Regenerate models.json

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-models-master
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Regenerate models.json
        run: |
          set -euo pipefail
          python3 artificialanalysis.ai-parser.py --minimal --pretty

      - name: Commit changed models.json
        run: |
          set -euo pipefail
          if git diff --quiet -- models.json; then
            echo 'models.json is unchanged'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models.json
          git commit -m 'chore(data): regenerate models.json'
          git push origin HEAD:master
