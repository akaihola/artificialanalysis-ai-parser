<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="AI models plotted by benchmark score against cost per task, from Artificial Analysis data.">
<title>Intelligence vs cost</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&display=swap">
<script>
  // Apply the stored theme, or the system theme, before the first paint.
  (() => {
    let theme = null;
    try { theme = localStorage.getItem("theme"); } catch (e) { /* storage blocked */ }
    if (theme !== "light" && theme !== "dark") {
      theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  /* ---------- Design tokens ---------- */
  :root {
    color-scheme: dark;
    --bg: #000;
    --fg: #fff;
    --fg-2: #aaa39d;
    --fg-3: #77716c;
    --line: #1c1a18;
    --line-2: #36312d;
    --surface: #0d0b0a;
    --hover: #141210;
    --accent: #c5ac98;
    --on-accent: #000;
    --sidebar-width: 248px;
    --header-height: 60px;
    font-synthesis: none;
    font-family: "DM Sans", system-ui, sans-serif;
    color: var(--fg);
    background: var(--bg);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #fff;
    --fg: #20201e;
    --fg-2: #625d57;
    --fg-3: #77716c;
    --line: #e8e4df;
    --line-2: #ccc5be;
    --surface: #f8f6f3;
    --hover: #f1eeea;
    --accent: #806047;
    --on-accent: #fff;
  }

  /* ---------- Resets ---------- */
  * { box-sizing: border-box; }
  body { margin: 0; user-select: none; -webkit-user-select: none; }
  input { user-select: text; -webkit-user-select: text; }
  button, input, a { -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; }
  button { color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled { opacity: .4; cursor: default; }
  a { color: inherit; text-decoration: none; }
  button:hover, a:hover { color: var(--fg); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  ::selection { background: var(--accent); color: var(--on-accent); }
  h2, h3 { margin: 0; }
  svg.icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; border: 0;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap;
  }
  .logo-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* ---------- App shell ---------- */
  .app { display: grid; grid-template-rows: var(--header-height) minmax(0, 1fr); height: 100dvh; }
  .app-header {
    display: flex; align-items: center; gap: 24px; padding: 0 28px;
    border-bottom: 1px solid var(--line);
  }
  .brand { flex-shrink: 0; white-space: nowrap; }
  .brand strong { font-size: 24px; font-weight: 450; letter-spacing: -1.2px; }
  .brand strong span { color: var(--accent); }
  .view-tabs {
    display: flex; align-self: stretch; align-items: stretch; gap: 22px; min-width: 0;
    overflow-x: auto; scrollbar-width: none;
  }
  .view-tabs button {
    position: relative; display: flex; align-items: center;
    color: var(--fg-2); font-size: 12.5px; white-space: nowrap;
  }
  .view-tabs button[aria-current="true"] { color: var(--fg); }
  .view-tabs button[aria-current="true"]::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: 2px; border-radius: 2px; background: var(--accent);
  }
  .tab-divider { flex-shrink: 0; align-self: center; width: 1px; height: 14px; background: var(--line-2); }
  .header-actions { display: flex; align-items: center; gap: 2px; margin-left: auto; flex-shrink: 0; }
  .icon-button {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; color: var(--fg-2);
  }

  .body-layout { display: grid; grid-template-columns: minmax(0, 1fr) var(--sidebar-width); min-height: 0; }
  main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
  .chart-section { display: flex; flex-direction: column; min-height: 0; padding: 18px 28px 10px; }
  .chart-heading {
    display: flex; flex-shrink: 0; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 6px;
  }
  .chart-heading h2 { flex-shrink: 1; font-size: 16px; font-weight: 500; }
  .chart-controls { display: flex; flex-shrink: 0; align-items: center; gap: 24px; }
  .check-button {
    display: inline-flex; align-items: center; gap: 8px; min-height: 32px;
    color: var(--fg); font-size: 12px; white-space: nowrap;
  }
  .check-button[aria-pressed="true"], .check-button:enabled:hover { color: var(--accent); }
  .selection {
    display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center;
    width: 12px; height: 12px; border: 1px solid var(--line-2); border-radius: 3px;
    color: var(--on-accent);
  }
  [aria-pressed="true"] > .selection { background: var(--accent); border-color: var(--accent); }
  .selection svg { width: 10px; height: 10px; stroke-width: 3; visibility: hidden; }
  [aria-pressed="true"] > .selection svg { visibility: visible; }
  .chart-scale { display: flex; flex-shrink: 0; gap: 12px; }
  .chart-scale button {
    min-height: 32px; padding: 4px 2px; color: var(--fg-3); font-size: 12px;
    border-bottom: 1px solid transparent;
  }
  .chart-scale button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .chart-scale button:hover { color: var(--fg); }

  .chart-wrap { position: relative; display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; }
  .chart-canvas { position: relative; flex: 1; min-height: 0; }
  .chart-canvas > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .chart-svg { font-family: "DM Sans", system-ui, sans-serif; }
  .chart-svg g[role="button"] { cursor: pointer; }
  .chart-svg g[role="button"]:focus { outline: none; }

  .empty {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
  }
  .empty[hidden] { display: none; }
  .empty strong { font-size: 17px; font-weight: 500; }
  .empty p { margin: 0; max-width: 46ch; color: var(--fg-2); font-size: 12.5px; }
  .text-button { color: var(--accent); font-size: 12px; }

  /* ---------- Tooltip ---------- */
  .chart-tooltip {
    position: absolute; right: 8px; bottom: 72px; z-index: 3;
    width: 272px; max-width: calc(100vw - 48px); padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px;
    pointer-events: none;
  }
  .chart-tooltip[hidden] { display: none; }
  .chart-tooltip.comparing { width: 400px; }
  .chart-tooltip.pinned button, .chart-tooltip.pinned a { pointer-events: auto; }
  .tooltip-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
  .tooltip-head strong { display: inline-flex; align-items: center; gap: 8px; font-weight: 550; }
  .tooltip-head button {
    display: flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; color: var(--fg-3);
  }
  .tooltip-head button svg { width: 14px; height: 14px; }
  .chart-tooltip p { margin: 4px 0 12px; color: var(--fg-2); font-size: 11.5px; }
  .tooltip-value { display: flex; justify-content: space-between; gap: 20px; padding: 4px 0; font-size: 12px; }
  .tooltip-value span { color: var(--fg-2); }
  .tooltip-value b { font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
  .tooltip-value small, .comparison-table small { display: block; color: var(--fg-3); font-size: 10.5px; font-weight: 400; }
  .chart-tooltip a {
    display: inline-block; margin-top: 10px; color: var(--accent); font-size: 11.5px;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .comparison-reference { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; color: var(--fg-2); font-size: 11.5px; }
  .comparison-table {
    width: 100%; border-collapse: collapse; font-size: 11.5px;
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .comparison-table th, .comparison-table td { padding: 4px 0 4px 12px; font-weight: 400; }
  .comparison-table thead th { color: var(--fg-3); font-size: 11px; border-bottom: 1px solid var(--line-2); }
  .comparison-table th:first-child { padding-left: 0; color: var(--fg-2); text-align: left; }
  .comparison-table td:last-child { font-weight: 550; }

  /* ---------- Lab logos ---------- */
  .lab-logo { flex-shrink: 0; vertical-align: middle; color: var(--fg); }
  .lab-monogram {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--hover); color: var(--fg-2); border-radius: 3px;
    font-weight: 600; line-height: 1;
  }

  /* ---------- Footer ---------- */
  footer {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    padding: 9px 28px; border-top: 1px solid var(--line); color: var(--fg-3); font-size: 11px;
  }
  footer a { color: var(--fg-2); }
  .footer-links { display: flex; gap: 20px; white-space: nowrap; }
  .footer-links a:last-child { color: var(--accent); }

  /* ---------- Sidebar ---------- */
  .sidebar {
    display: flex; flex-direction: column; gap: 18px; height: 100%; min-height: 0;
    padding: 16px 18px; overflow: auto; border-left: 1px solid var(--line);
    scrollbar-width: thin; scrollbar-color: var(--line-2) var(--bg);
  }
  .sidebar > * { flex-shrink: 0; }
  .side-heading { display: flex; align-items: center; gap: 8px; margin-bottom: -6px; }
  .side-heading h2 { flex: 1; font-size: 15px; font-weight: 500; }
  .side-heading h2 span {
    margin-left: 6px; color: var(--fg-3); font-size: 11px; font-weight: 400;
    font-variant-numeric: tabular-nums;
  }
  .side-heading button {
    display: flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; color: var(--fg-3);
  }
  .side-heading button svg { width: 14px; height: 14px; }
  .effort-filter h3, .section-head h3, .option-section h3 { font-size: 12px; font-weight: 550; }
  #plan-sections { display: contents; }
  .option-section h3 { white-space: nowrap; }
  .effort-filter > div { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 8px; }
  .effort-filter button { color: var(--fg); font-size: 11.5px; }
  .effort-filter button[aria-pressed="false"] { color: var(--fg-3); text-decoration: line-through; }
  .section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .section-head h3 { flex: 1; }
  .section-head button { color: var(--fg-3); font-size: 11.5px; }
  .section-head button[aria-pressed="true"] { color: var(--accent); }
  .section-head [role="group"] { display: flex; gap: 10px; }
  .time-filter input[type="range"] {
    --fill: 100%;
    display: block; width: 100%; height: 22px; margin: 4px 0 0;
    appearance: none; -webkit-appearance: none; background: none; cursor: pointer;
  }
  .time-filter input[type="range"]::-webkit-slider-runnable-track {
    height: 1px; background: linear-gradient(to right, var(--accent) var(--fill), var(--line-2) var(--fill));
  }
  .time-filter input[type="range"]::-moz-range-track { height: 1px; background: var(--line-2); }
  .time-filter input[type="range"]::-moz-range-progress { height: 1px; background: var(--accent); }
  .time-filter input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5.5px;
    border: 0; border-radius: 50%; background: var(--accent);
  }
  .time-filter input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--accent);
  }
  .slider-readout { color: var(--fg-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }

  /* ---------- Breakpoints ---------- */
  @media (width >= 1600px) {
    .view-tabs { gap: 26px; }
    .view-tabs button { font-size: 13px; }
  }
  @media (width >= 761px) and (height <= 820px) {
    .sidebar { gap: 14px; padding-top: 12px; }
  }
  @media (width <= 1150px) {
    .app-header { gap: 16px; padding: 0 18px; }
    .brand strong { font-size: 21px; }
    .view-tabs { gap: 16px; }
    .view-tabs button { font-size: 12px; }
    .chart-section { padding-left: 18px; padding-right: 18px; }
    footer { padding: 9px 18px; }
  }
  /* Narrow screens: one scrolling column. The mobile sheet comes in a later stage. */
  @media (width <= 900px) {
    .app { display: block; height: auto; }
    .app-header { flex-wrap: wrap; gap: 0 16px; height: auto; min-height: 52px; padding: 0 16px; }
    .view-tabs { order: 3; width: 100%; height: 42px; border-top: 1px solid var(--line); }
    .body-layout, main { display: block; }
    .chart-section { padding: 20px 16px 24px; }
    .chart-heading { flex-wrap: wrap; gap: 4px 16px; }
    .chart-controls { flex: 1 0 100%; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; }
    .chart-canvas { flex: none; aspect-ratio: 1 / 1.2; }
    .sidebar { height: auto; border-left: 0; border-top: 1px solid var(--line); }
    .brand strong { font-size: 21px; }
    footer, .footer-links { flex-wrap: wrap; white-space: normal; }
  }
  @media (width <= 420px) {
    .brand strong { font-size: 19px; }
    .icon-button { width: 28px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="app-header">
    <a class="brand" id="brand" href="intelligence-vs-cost.html" aria-label="Intelligence vs cost, reset all settings">
      <strong><span>intelligence</span> vs cost</strong>
    </a>
    <nav class="view-tabs" id="metric-tabs" aria-label="Benchmark"></nav>
    <div class="header-actions">
      <button class="icon-button" id="theme-toggle" type="button"></button>
      <button class="icon-button" id="png-button" type="button" title="Download PNG" aria-label="Download PNG">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px"><path d="M12 3.5v11.5M7 10l5 5 5-5M4 16.5v3.5h16v-3.5"/></svg>
      </button>
      <button class="icon-button" id="fullscreen-button" type="button" title="Full screen" aria-label="Full screen">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      </button>
      <button class="icon-button" id="table-button" type="button" title="Table view" aria-label="Table view" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 10h17M3.5 15h17M9.5 10v9.5"/></svg>
      </button>
      <button class="icon-button" id="help-button" type="button" title="How to read this chart" aria-label="How to read this chart">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.4 9.3a2.7 2.7 0 0 1 5.2 1c0 1.8-2.6 2.4-2.6 4M12 17.6h.01"/></svg>
      </button>
      <button class="icon-button" id="settings-button" type="button" title="Chart settings" aria-label="Chart settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:17px;height:17px"><circle cx="5.5" cy="12" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="18.5" cy="12" r=".9"/></svg>
      </button>
    </div>
  </header>

  <div class="body-layout">
    <main>
      <section class="chart-section" id="chart-section" aria-labelledby="chart-title">
        <div class="chart-heading">
          <h2 id="chart-title">Cost vs intelligence</h2>
          <div class="chart-controls" id="chart-controls">
            <button class="check-button" id="pareto-toggle" type="button" aria-pressed="true"
                    title="Show non-dominated variants: no other visible variant scores higher for the same or a lower cost.">
              <span class="selection"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Pareto line</button>
            <div class="chart-scale" role="group" aria-label="Cost axis scale">
              <button type="button" id="scale-linear" aria-pressed="false">Linear</button>
              <button type="button" id="scale-log" aria-pressed="true">Log</button>
            </div>
            <button class="check-button" id="zoom-toggle" type="button" aria-pressed="false"
                    title="Fit the score axis to the models on the Pareto line.">
              <span class="selection"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Zoom Y to Pareto</button>
            <button class="check-button" id="deprecated-toggle" type="button" aria-pressed="false"
                    title="List and plot deprecated models. Their lines are dashed.">
              <span class="selection"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Show deprecated</button>
          </div>
        </div>
        <div class="chart-wrap" id="chart-wrap">
          <div class="chart-canvas" id="chart-canvas">
            <svg class="chart-svg" id="chart" role="group" aria-label="Cost per task versus Intelligence index"></svg>
          </div>
          <div class="empty" id="empty-state" hidden>
            <strong id="empty-title"></strong>
            <p id="empty-text"></p>
            <button class="text-button" id="empty-action" type="button"></button>
          </div>
          <div class="chart-tooltip" id="tooltip" role="status" hidden></div>
        </div>
      </section>
      <footer>
        <span>Data from <a href="https://artificialanalysis.ai/" target="_blank" rel="noreferrer">Artificial Analysis</a>
          and <a href="https://livebench.ai/" target="_blank" rel="noreferrer">LiveBench</a></span>
        <nav class="footer-links" aria-label="Credits">
          <a href="https://github.com/lobehub/lobe-icons" target="_blank" rel="noreferrer">Lab logos: LobeHub Icons, MIT licence</a>
          <a href="https://simpleicons.org/" target="_blank" rel="noreferrer">Xiaomi logo: Simple Icons, CC0</a>
          <a href="https://github.com/akaihola/artificialanalysis-ai-parser" target="_blank" rel="noreferrer">Source on GitHub</a>
        </nav>
      </footer>
    </main>

    <aside class="sidebar" id="sidebar" aria-label="Filters">
      <div class="side-heading">
        <h2>Models<span id="model-count"></span></h2>
        <button type="button" id="reset-selection" title="Reset selection" aria-label="Reset selection">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.6M4 3.8v4.8h4.8"/></svg>
        </button>
      </div>
      <!-- The model search and the Frontier, Notable and Other lists are added in the next stage. -->
      <div class="effort-filter" role="group" aria-labelledby="effort-heading">
        <h3 id="effort-heading">Reasoning</h3>
        <div id="effort-buttons"></div>
      </div>
      <div id="plan-sections"></div>
      <section class="option-section time-filter" aria-labelledby="time-heading">
        <h3 id="time-heading">Max response time</h3>
        <input type="range" id="time-slider" min="0" max="200" step="1" value="200"
               aria-label="Maximum end-to-end response time" aria-describedby="time-readout">
        <div class="slider-readout" id="time-readout">No limit</div>
      </section>
    </aside>
  </div>
</div>

/* =========================================================================
 * Pure helpers: formatters, data, scales, ticks, Pareto, labels, URL codec.
 * Nothing here touches the DOM.
 * ========================================================================= */
const metricById = (id) => CONFIG.metrics.find((m) => m.id === id) || CONFIG.metrics[0];
const numberOrNull = (v) => (typeof v === "number" && Number.isFinite(v) ? v : null);
const round2 = (n) => Math.round(n * 100) / 100;
const clean = (n) => Number(n.toPrecision(12));  // drops float noise such as 0.6000000000000001

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/** Dollars. Below $0.01 two significant digits; `short` is for axis ticks. */
function fmtCost(v, short = false) {
  if (v == null || !Number.isFinite(v)) return "—";
  if (short && v >= 1000) return "$" + (v / 1000).toFixed(1).replace(/\.0$/, "") + "k";
  if (v > 0 && v < 0.01) return "$" + String(Number(v.toPrecision(2)));
  return "$" + v.toLocaleString("en-US", {
    maximumFractionDigits: v < 1 ? 3 : 2,
    minimumFractionDigits: short ? 0 : 2,
  });
}
function fmtScore(v) {
  return v == null ? "—" : v.toLocaleString("en-US", { maximumFractionDigits: 1 });
}
function fmtSeconds(v) {
  return v == null ? "—" : v.toFixed(v < 10 ? 1 : 0) + " s";
}
function fmtSpeed(v) {
  return v == null ? "—" : Math.round(v) + " tok/s";
}
/** Ratio a ÷ b, e.g. "0.545×". */
function fmtMult(a, b) {
  if (a == null || b == null || b === 0) return "—";
  return (a / b).toLocaleString("en-US", { maximumSignificantDigits: 3 }) + "×";
}
const shortName = (name) => name.replace("Claude ", "");
const effortText = (v) => (v.effort === "none" ? "none" : v.effortLabel.toLowerCase());

function slugify(s) {
  return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}
function compareText(a, b) {
  return a < b ? -1 : a > b ? 1 : 0;
}

/** Normalise models.json rows into plottable variants and their families. */
function normalise(models) {
  const forced = new Set(CONFIG.forceDeprecated);
  const variants = [];
  for (const m of models) {
    if (!(m.cost_per_task > 0)) continue;  // no cost, or zero price: not plottable
    const effort = CONFIG.efforts[m.effort] ? m.effort : (m.reasoning ? "default" : "none");
    const family = m.family || m.slug;
    const scores = {};
    for (const metric of CONFIG.metrics) scores[metric.id] = numberOrNull(m[metric.id]);
    variants.push({
      id: m.slug,
      family,
      name: m.family_name || m.name,
      fullName: m.name,
      lab: m.lab || slugify(m.creator),
      labName: m.lab_name || m.creator || "",
      released: m.released || "",
      effort,
      effortLabel: CONFIG.efforts[effort].label,
      effortOrder: numberOrNull(m.effort_order) ?? CONFIG.efforts[effort].order,
      deprecated: !!m.deprecated || forced.has(family),
      open: !!m.open_weights,
      cost: m.cost_per_task,
      time: numberOrNull(m.e2e_response_time_s),
      speed: numberOrNull(m.output_tokens_per_second),
      scores,
      livebench: m.livebench || null,
    });
  }
  // Slug order sets the paint order of families and points.
  variants.sort((a, b) => compareText(a.id.toLowerCase(), b.id.toLowerCase()));
  const families = new Map();
  for (const v of variants) {
    if (!families.has(v.family)) {
      families.set(v.family, { id: v.family, name: v.name, lab: v.lab, labName: v.labName,
        released: v.released, open: v.open, variants: [] });
    }
    families.get(v.family).variants.push(v);
  }
  for (const f of families.values()) {
    f.variants.sort((a, b) => a.effortOrder - b.effortOrder);
    f.deprecated = f.variants[0].deprecated;
  }
  const times = variants.map((v) => v.time).filter((t) => t > 0);
  const timeRange = times.length
    ? [Math.max(1, Math.floor(Math.min(...times))), Math.ceil(Math.max(...times))]
    : [1, 1000];
  return { variants, families, byId: new Map(variants.map((v) => [v.id, v])),
    efforts: new Set(variants.map((v) => v.effort)), timeRange };
}

function familyColor(family, lab, theme) {
  const c = CONFIG.frontier[family] || CONFIG.notable[family] || CONFIG.labs[lab] || CONFIG.fallbackColor;
  return c[theme === "light" ? "light" : "dark"];
}

/** The subscription plan that prices this variant, or null for API price. */
function planFor(v, planIds) {
  for (const group of CONFIG.plans) {
    if (v.lab !== group.lab || (group.closedOnly && v.open)) continue;
    const plan = group.options.find((o) => o.id === planIds[group.key]) || group.options[0];
    return plan.apiValue ? plan : null;
  }
  return null;
}
function effectiveCost(v, planIds) {
  const plan = planFor(v, planIds);
  return plan ? v.cost * plan.monthlyFee / plan.apiValue : v.cost;
}

/** The max-response-time slider is linear in log(seconds); the last step is "no limit". */
function sliderToSeconds(pos, steps, [lo, hi]) {
  if (pos >= steps) return Infinity;
  return Math.round(Math.exp(Math.log(lo) + pos / steps * (Math.log(hi) - Math.log(lo))));
}
function secondsToSlider(seconds, steps, [lo, hi]) {
  if (!Number.isFinite(seconds)) return steps;
  const t = (Math.log(seconds) - Math.log(lo)) / (Math.log(hi) - Math.log(lo));
  return Math.min(steps - 1, Math.round(Math.min(1, Math.max(0, t)) * steps));
}

/** Chart geometry for a measured canvas size. 1 SVG unit = 1 CSS px. */
function geometry(width, height, compact) {
  const L = CONFIG.layout, g = compact ? L.compact : L.desktop;
  const W = Math.max(g.minWidth, width), H = Math.max(L.minHeight, height);
  const v = compact ? 1 : Math.min(1.15, Math.max(1, W / 1200));
  const X0 = g.left, X1 = W - g.gutter, Y0 = H - g.bottom, Ytop = L.top;
  const maxLabels = compact ? Infinity
    : Math.min(L.maxLabels, Math.floor((Y0 - Ytop) / L.labelSpacing) + 1);
  return { W, H, v, X0, X1, Y0, Ytop, maxLabels, compact,
    xTitleY: Y0 + g.xTitleOffset, xTitleSize: g.xTitleSize * v };
}

function xDomain(values, linear) {
  const max = Math.max(values.length ? Math.max(...values) : 1, 1e-6) * 1.08;
  if (linear) return [0, max];
  const positive = values.filter((x) => x > 0);
  return [Math.max((positive.length ? Math.min(...positive) : max / 10) * 0.7, 1e-6), max];
}
/** Score domain. The default keeps at least 20–55; the Pareto zoom has no such floor. */
function yDomain(values, zoom = false) {
  if (!values.length) return [0, 100];
  const lo = Math.min(...values), hi = Math.max(...values);
  if (zoom) return [Math.max(0, Math.floor((lo - 2) / 5) * 5), Math.ceil((hi + 2) / 5) * 5];
  return [Math.max(0, Math.floor((Math.min(lo, 30) - 4) / 10) * 10), Math.ceil((Math.max(hi, 50) + 2) / 5) * 5];
}
function linearScale([d0, d1], [r0, r1]) {
  return (v) => r0 + (v - d0) / (d1 - d0) * (r1 - r0);
}
function logScale([d0, d1], [r0, r1]) {
  return (v) => r0 + Math.log10(v / d0) / Math.log10(d1 / d0) * (r1 - r0);
}

/** Round ticks: step 1, 2, 5 or 10 × 10^k, about n of them. */
function niceTicks(lo, hi, n = 5) {
  const raw = (hi - lo) / n || 1;
  const p = 10 ** Math.floor(Math.log10(raw));
  const r = raw / p;
  const step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * p;
  const ticks = [];
  for (let i = Math.ceil(clean(lo / step)); clean(i * step) <= hi; i++) ticks.push(clean(i * step));
  return ticks;
}
function logTicks(min, max, compact = false) {
  const narrow = Math.log10(max / min) < 1.5;
  const mantissas = narrow ? (compact ? [1, 2, 5] : [1, 1.5, 2, 3, 5, 7]) : (compact ? [1, 3] : [1, 2, 5]);
  const ticks = [];
  for (let e = -6; e <= 4; e++) {
    for (const m of mantissas) {
      const t = clean(m * 10 ** e);
      if (t >= min && t <= max) ticks.push(t);
    }
  }
  return ticks;
}

/** Non-dominated rows: sorted by cost, kept when the score beats every cheaper row. */
function paretoSet(rows) {
  const sorted = rows.filter((r) => r.x != null && r.y != null).sort((a, b) => a.x - b.x || b.y - a.y);
  const front = [];
  let best = -Infinity;
  for (const r of sorted) {
    if (r.y > best) { front.push(r); best = r.y; }
  }
  return front;
}

/** Right-side labels: top-first, at least `spacing` apart, shifted up if they overflow. */
function layoutLabels(entries, Y0, maxLabels, spacing = CONFIG.layout.labelSpacing) {
  const kept = entries.map((e, i) => [e, i]).sort((a, b) => a[0].y - b[0].y || a[1] - b[1])
    .slice(0, maxLabels).map(([e]) => e);
  let prev = 6;
  const out = kept.map((e) => {
    const ly = Math.max(e.y, prev + spacing);
    prev = ly;
    return { ...e, ly };
  });
  const overflow = out.length ? out[out.length - 1].ly - Y0 : 0;
  if (overflow > 0) for (const o of out) o.ly -= overflow;
  return out;
}

/** Variants that pass the selection, reasoning and deprecation filters, with chart values. */
function buildRows(data, s) {
  const metric = metricById(s.metric);
  const selected = new Set(s.selected), excluded = new Set(s.excluded);
  const base = data.variants.filter((v) => selected.has(v.family) && !excluded.has(v.effort) &&
    (s.deprecated || !data.families.get(v.family).deprecated));
  const rows = [];
  for (const v of base) {
    const y = v.scores[metric.id];
    const x = effectiveCost(v, s.plans);
    if (y == null || (!s.linear && !(x > 0))) continue;
    rows.push({ v, id: v.id, family: v.family, x, y,
      ghost: v.time != null && v.time > s.maxTime });
  }
  return { metric, base, rows, visible: rows.filter((r) => !r.ghost), ghosts: rows.filter((r) => r.ghost) };
}

/** Everything the chart draws, derived from data, state and canvas size. */
function chartModel(data, s) {
  const { metric, base, rows, visible, ghosts } = buildRows(data, s);
  const geo = geometry(s.size.width, s.size.height, s.compact);
  const pareto = s.frontier ? paretoSet(visible) : [];
  const paretoIds = new Set(pareto.map((r) => r.id));
  const paretoFams = new Set(pareto.map((r) => r.family));
  const xd = xDomain(rows.map((r) => r.x), s.linear);
  const zoomed = s.zoomY && s.frontier && pareto.length > 0;
  const yd = yDomain((zoomed ? pareto : rows).map((r) => r.y), zoomed);
  const xs = (s.linear ? linearScale : logScale)(xd, [geo.X0, geo.X1]);
  const ys = linearScale(yd, [geo.Y0, geo.Ytop]);
  const inY = (r) => r.y >= yd[0] && r.y <= yd[1];

  // Families in paint order, each with its rows in effort order.
  const families = new Map();
  for (const r of visible) {
    if (!families.has(r.family)) families.set(r.family, []);
    families.get(r.family).push(r);
  }
  for (const list of families.values()) list.sort((a, b) => a.v.effortOrder - b.v.effortOrder);

  const byId = new Map(visible.map((r) => [r.id, r]));
  const pinned = byId.get(s.pinned) || null;
  const hovered = byId.get(s.hovered) || null;
  const active = hovered || pinned;
  const comparing = !!(pinned && hovered && pinned.id !== hovered.id);
  const highlights = new Set(s.highlights);
  let focus = (s.labels && s.labelHover) || s.focusFamily || (geo.compact && pinned ? pinned.family : null);
  if (focus && !families.has(focus)) focus = null;
  const anyEmph = visible.some((r) => highlights.has(r.family)) || !!focus;
  const emph = (f) => highlights.has(f) || f === focus;

  // One label per family, anchored at its best-scoring variant inside the Y range.
  let labels = [];
  if (s.labels && !geo.compact) {
    const entries = [];
    for (const [family, list] of families) {
      const anchor = list.filter(inY).reduce((best, r) => (!best || r.y > best.y ? r : best), null);
      if (anchor) entries.push({ family, anchor, y: ys(anchor.y) });
    }
    labels = layoutLabels(entries, geo.Y0, geo.maxLabels);
  }

  return {
    metric, base, rows, visible, ghosts, geo, xd, yd, xs, ys, zoomed,
    xTicks: s.linear ? niceTicks(0, xd[1]) : logTicks(xd[0], xd[1], geo.compact),
    yTicks: niceTicks(yd[0], yd[1]),
    pareto, paretoIds, paretoFams, families, labels,
    pinned, hovered, active, comparing, highlights, focus, anyEmph, emph,
  };
}

/* ---------- URL codec ---------- */
const URL_KEYS = {
  metric: "metric", selected: "models", excluded: "hide-reasoning", frontier: "frontier",
  linear: "linear", labels: "labels", maxTime: "max_response_time", deprecated: "deprecated",
};
const sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
const parseBool = (v) => v.toLowerCase() === "true";
const parseList = (v, known) => [...new Set(v.split(",").filter((x) => known.has(x)))];

/**
 * Read state from a query string. Unknown values fall back to defaults.
 * `known` = { families: Set, efforts: Set }.
 */
function decodeUrl(search, known) {
  const p = new URLSearchParams(search);
  const d = CONFIG.defaults;
  const get = (k) => p.get(k);
  const out = {};
  const metric = get(URL_KEYS.metric);
  out.metric = CONFIG.metrics.some((m) => m.id === metric) ? metric : d.metric;
  const models = get(URL_KEYS.selected);
  const selected = models == null ? [] : parseList(models, known.families);
  out.selected = selected.length ? selected : [...d.selected];
  const hide = get(URL_KEYS.excluded);
  out.excluded = hide == null ? [...d.excluded] : parseList(hide, known.efforts);
  for (const key of ["frontier", "linear", "labels", "deprecated"]) {
    const v = get(URL_KEYS[key]);
    out[key] = v == null ? d[key] : parseBool(v);
  }
  out.plans = {};
  for (const group of CONFIG.plans) {
    const id = get(group.urlKey);
    out.plans[group.key] = group.options.some((o) => o.id === id) ? id : d.plans[group.key];
  }
  const t = Number(get(URL_KEYS.maxTime));
  out.maxTime = get(URL_KEYS.maxTime) != null && t > 0 ? t : d.maxTime;
  return out;
}

/** Write state as a readable query string. Defaults are omitted; other params are kept. */
function encodeUrl(s, existingSearch = "") {
  const d = CONFIG.defaults;
  const p = new URLSearchParams(existingSearch);
  const managed = [...Object.values(URL_KEYS), ...CONFIG.plans.map((g) => g.urlKey)];
  for (const k of managed) p.delete(k);
  const pairs = [...p].map(([k, v]) => [k, v]);
  const add = (k, v) => pairs.push([k, String(v)]);
  if (s.metric !== d.metric) add(URL_KEYS.metric, s.metric);
  if (!sameSet(s.selected, d.selected)) add(URL_KEYS.selected, s.selected.join(","));
  if (!sameSet(s.excluded, d.excluded)) add(URL_KEYS.excluded, s.excluded.join(","));
  for (const key of ["frontier", "linear", "labels"]) if (s[key] !== d[key]) add(URL_KEYS[key], s[key]);
  for (const group of CONFIG.plans) {
    if (s.plans[group.key] !== d.plans[group.key]) add(group.urlKey, s.plans[group.key]);
  }
  if (Number.isFinite(s.maxTime)) add(URL_KEYS.maxTime, s.maxTime);
  if (s.deprecated !== d.deprecated) add(URL_KEYS.deprecated, s.deprecated);
  const enc = (v) => encodeURIComponent(v).replace(/%2C/gi, ",");
  return pairs.length ? "?" + pairs.map(([k, v]) => enc(k) + "=" + enc(v)).join("&") : "";
}

/** Lab mark for HTML: a logo from the sprite, or a letter monogram. */
function labMark(lab, labName, size) {
  if (CONFIG.labs[lab]?.logo) {
    return `<svg class="lab-logo" width="${size}" height="${size}" aria-hidden="true"><use href="#logo-${esc(lab)}"/></svg>`;
  }

}

/** Replace an element's markup, keeping keyboard focus on the element with the same data-key. */
function setHTML(el, html) {
  if (el._html === html) return;
  const active = document.activeElement;
  const key = el.contains(active) ? active.getAttribute("data-key") : null;
  el._html = html;
  el.innerHTML = html;
  if (key != null) el.querySelector(`[data-key="${CSS.escape(key)}"]`)?.focus({ preventScroll: true });
}

function themeColors() {
  const cs = getComputedStyle(document.documentElement);
  const v = (name) => cs.getPropertyValue(name).trim();
  return { bg: v("--bg"), fg: v("--fg"), fg2: v("--fg-2"), fg3: v("--fg-3"),
    line: v("--line"), line2: v("--line-2"), hover: v("--hover") };
}

/* ---------- Header ---------- */
function renderHeader() {
  let html = "";
  CONFIG.metrics.forEach((m, i) => {
    // A divider separates the Artificial Analysis benchmarks from the LiveBench ones.
    if (i && m.livebench && !CONFIG.metrics[i - 1].livebench) html += '<span class="tab-divider" aria-hidden="true"></span>';
    html += `<button type="button" data-key="${m.id}" aria-current="${m.id === state.metric}">${esc(m.tab)}</button>`;
  });
  setHTML(els.tabs, html);
  const light = state.theme === "light";
  els.theme.innerHTML = icon(light ? "moon" : "sun");
  els.theme.title = light ? "Switch to dark mode" : "Switch to light mode";
  els.theme.setAttribute("aria-label", els.theme.title);
}

/* ---------- Toolbar ---------- */
function renderToolbar() {
  const metric = metricById(state.metric);
  els.title.textContent = metric.title;
  els.pareto.setAttribute("aria-pressed", state.frontier);
  els.linear.setAttribute("aria-pressed", state.linear);
  els.log.setAttribute("aria-pressed", !state.linear);

  els.zoom.setAttribute("aria-pressed", state.zoomY && state.frontier);
  els.deprecated.setAttribute("aria-pressed", state.deprecated);
}

/* ---------- Sidebar ---------- */
function renderSidebar() {
  const data = state.data;
  els.count.textContent = state.selected.length;

  // Reasoning levels present in the selected families, in effort order.
  const selected = new Set(state.selected);
  const levels = new Map();
  data.variants.filter((v) => selected.has(v.family)).sort((a, b) => a.effortOrder - b.effortOrder)
    .forEach((v) => { if (!levels.has(v.effort)) levels.set(v.effort, v); });
  setHTML(els.efforts, [...levels.values()].map((v) =>
    `<button type="button" data-key="${v.effort}" aria-pressed="${!state.excluded.includes(v.effort)}">${esc(effortText(v))}</button>`).join(""));

  setHTML(els.plans, CONFIG.plans.map((group) => `
    <section class="option-section" aria-labelledby="plan-${group.key}-heading">
      <div class="section-head">
        <h3 id="plan-${group.key}-heading">${esc(group.label)}</h3>
        <div role="group" aria-labelledby="plan-${group.key}-heading">${group.options.map((o) =>
          `<button type="button" data-key="${group.key}:${o.id}" data-group="${group.key}" data-plan="${o.id}" title="${esc(o.fullName)}" aria-pressed="${state.plans[group.key] === o.id}">${esc(o.name)}</button>`).join("")}</div>
      </div>
    </section>`).join(""));

  renderTimeFilter();
}

function renderTimeFilter() {
  const { timeRange } = state.data;
  // Keep the thumb where the user dragged it; move it only when state came from elsewhere.
  if (sliderToSeconds(+els.slider.value, CONFIG.sliderSteps, timeRange) !== state.maxTime) {
    els.slider.value = secondsToSlider(state.maxTime, CONFIG.sliderSteps, timeRange);
  }
  els.slider.style.setProperty("--fill", (+els.slider.value / CONFIG.sliderSteps * 100) + "%");
  if (!Number.isFinite(state.maxTime)) {
    els.readout.textContent = "No limit";
  } else {
    const hidden = buildRows(state.data, state).ghosts.length;
    els.readout.textContent = `≤ ${Math.round(state.maxTime)} s · ${hidden} hidden`;
  }
  els.slider.setAttribute("aria-valuetext", els.readout.textContent);
}

/* ---------- Chart ---------- */
let chartRendering = false;

function renderChart() {
  if (!state.data) return;
  const m = chartModel(state.data, state);
  const showEmpty = m.rows.length < CONFIG.minChartPoints;
  renderEmpty(m, showEmpty);
  els.svg.style.visibility = showEmpty ? "hidden" : "";
  els.svg.setAttribute("aria-label", `${m.metric.axis} versus cost per task`);
  chartRendering = true;
  try {
    setHTML(els.svg, showEmpty ? "" : drawChart(m, themeColors()));
  } finally {
    chartRendering = false;
  }
  els.svg.setAttribute("viewBox", `0 0 ${m.geo.W} ${m.geo.H}`);
  renderTooltip(showEmpty ? null : m);
}

function drawChart(m, c) {
  const { geo, xs, ys, metric } = m;
  const { W, H, v, X0, X1, Y0, Ytop } = geo;
  const theme = state.theme;
  const col = (r) => familyColor(r.family, r.v.lab, theme);
  const out = [];

  out.push(`<rect width="${W}" height="${H}" fill="${c.bg}"/>`);
  out.push(`<text x="${X0}" y="18" fill="${c.fg2}" font-size="${12 * v}">${esc(metric.axis)}</text>`);
  for (const t of m.yTicks) {
    out.push(`<g transform="translate(0 ${round2(ys(t))})"><line x1="${X0}" x2="${X1}" stroke="${c.line}" stroke-dasharray="2 6"/>` +
      `<text x="${X0 - 17}" y="4" text-anchor="end" fill="${c.fg3}" font-size="${12 * v}">${t}</text></g>`);
  }
  for (const t of m.xTicks) {
    out.push(`<g transform="translate(${round2(xs(t))} ${Y0})"><line y2="5" stroke="${c.line2}"/>` +
      `<text y="26" text-anchor="middle" fill="${c.fg3}" font-size="${12 * v}">${fmtCost(t, true)}</text></g>`);
  }
  out.push(`<line x1="${X0}" x2="${X1}" y1="${Y0}" y2="${Y0}" stroke="${c.line2}"/>`);

  // Rows outside the zoomed Y range are clipped to the plot.
  const clip = m.zoomed ? ' clip-path="url(#plot-clip)"' : "";
  if (m.zoomed) out.push(`<clipPath id="plot-clip"><rect x="0" y="${Ytop - 8}" width="${W}" height="${Y0 - Ytop + 8}"/></clipPath>`);
  const at = (r) => `cx="${round2(xs(r.x))}" cy="${round2(ys(r.y))}"`;

  if (m.pareto.length > 1) {
    const d = m.pareto.map((r, i) => `${i ? "L" : "M"}${round2(xs(r.x))},${round2(ys(r.y))}`).join(" ");
    out.push(`<path d="${d}" fill="none" stroke="${c.fg}" stroke-width="2.5" stroke-dasharray="6 5" opacity=".95" pointer-events="none"${clip}/>`);
  }

  // Models hidden by the response time filter: faint, not interactive, not on any line.
  if (m.ghosts.length) {
    out.push(`<g class="ghosts" pointer-events="none" opacity=".15"${clip}>` +
      m.ghosts.map((r) => `<circle ${at(r)} r="4.5" fill="${col(r)}"/>`).join("") + "</g>");
  }

  const pareto = m.pareto.length > 0;
  for (const [family, rows] of m.families) {
    const color = col(rows[0]);
    const e = m.emph(family);
    const groupOpacity = !pareto && m.anyEmph && !e ? 0.15 : 1;
    const lineOpacity = pareto ? (e ? 0.6 : m.paretoFams.has(family) ? 0.25 : 0.08) : (e ? 1 : 0.8);
    const dash = rows[0].v.deprecated ? ' stroke-dasharray="5 5"' : "";
    let g = `<g data-family="${esc(family)}" opacity="${groupOpacity}"${clip}>`;
    if (rows.length > 1) {
      const d = rows.map((r, i) => `${i ? "L" : "M"}${round2(xs(r.x))},${round2(ys(r.y))}`).join(" ");
      g += `<path d="${d}" fill="none" stroke="${color}" stroke-width="${e ? 3.5 : 2.25}" opacity="${lineOpacity}"${dash} pointer-events="none"/>`;
    }
    for (const r of rows) {
      const isActive = r === m.active, isPinned = r === m.pinned, onFront = m.paretoIds.has(r.id);
      const radius = isActive || isPinned ? 7 : onFront ? 6 : 4.5;
      const opacity = pareto ? (onFront || isActive || isPinned ? 1 : 0.15)
        : (m.anyEmph || !m.active || isActive || isPinned ? 1 : 0.45);
      const label = `${r.v.name}, ${r.v.effortLabel}, cost per task ${fmtCost(r.x)}, ${metric.axis} ${fmtScore(r.y)}`;
      g += `<g role="button" tabindex="0" data-key="p:${esc(r.id)}" data-id="${esc(r.id)}" aria-pressed="${isPinned}" aria-label="${esc(label)}" opacity="${opacity}">` +
        `<circle ${at(r)} r="13" fill="transparent"/>` +
        `<circle ${at(r)} r="${radius}" fill="${color}" stroke="${onFront ? c.fg : c.bg}" stroke-width="${onFront ? 1.5 : 1.8}"/></g>`;
    }
    out.push(g + "</g>");
  }

  // Right-side family labels with leader lines.
  for (const l of m.labels) {
    const r = l.anchor, f = state.data.families.get(l.family);
    const color = col(r);
    const px = round2(xs(r.x)), py = round2(ys(r.y)), ly = round2(l.ly);
    out.push(`<path d="M${px + 6},${py} L${X1 + 18},${ly} L${X1 + 20},${ly}" fill="none" stroke="${color}" stroke-width=".75" opacity=".22" pointer-events="none"/>`);
    const opacity = pareto ? (m.paretoFams.has(l.family) ? 1 : 0.2) : (m.anyEmph && !m.emph(l.family) ? 0.4 : 1);
    const weight = m.paretoFams.has(l.family) ? 700 : 550;
    let mark;
    if (CONFIG.labs[f.lab]?.logo) {
      mark = `<use href="#logo-${esc(f.lab)}" x="27" y="-9" width="18" height="18" color="${c.fg}"/>`;
    } else {
      mark = `<rect x="27" y="-9" width="18" height="18" rx="3" fill="${c.hover}"/>` +
        `<text x="36" y="3.5" text-anchor="middle" font-size="9.9" font-weight="600" fill="${c.fg2}">${esc((f.labName || f.lab).charAt(0))}</text>`;
    }
    out.push(`<g class="series-label" role="button" tabindex="0" data-key="l:${esc(l.family)}" data-label="${esc(l.family)}" aria-pressed="${m.highlights.has(l.family)}" aria-label="Highlight ${esc(f.name)}" transform="translate(${X1} ${ly})" opacity="${opacity}">` +
      `<rect x="24" y="-12" width="${W - X1 - 24}" height="24" fill="transparent"/>${mark}` +
      `<text x="53" y="4" fill="${color}" font-size="${13 * v}" font-weight="${weight}">${esc(shortName(f.name))}</text></g>`);
  }

  out.push(`<text x="${round2((X0 + X1) / 2)}" y="${geo.xTitleY}" text-anchor="middle" fill="${c.fg2}" font-size="${geo.xTitleSize}">${esc(xTitle())}</text>`);

  // Crosshairs: the pinned model, plus the hovered one when comparing.
  const marked = m.pinned ? [m.pinned, ...(m.comparing ? [m.hovered] : [])] : m.hovered ? [m.hovered] : [];
  let overlay = "";
  for (const r of marked) {
    const color = col(r), px = round2(xs(r.x)), py = round2(ys(r.y));
    const dash = r === m.pinned ? "" : ' stroke-dasharray="4 4"';
    const halo = `stroke="${c.bg}" stroke-width="3" paint-order="stroke"`;
    overlay += `<line x1="${X0}" x2="${X1}" y1="${py}" y2="${py}" stroke="${color}" stroke-opacity=".8"${dash}/>` +
      `<text x="${X0 + 6}" y="${py - 7}" fill="${color}" font-size="${11 * v}" ${halo}>${fmtScore(r.y)}</text>` +
      `<line x1="${px}" x2="${px}" y1="${Ytop}" y2="${Y0}" stroke="${color}" stroke-opacity=".5"${dash}/>` +
      `<text x="${Math.min(px + 6, X1 - 60)}" y="${Y0 - 8}" fill="${color}" font-size="${11 * v}" ${halo}>${fmtCost(r.x)}</text>`;
  }
  out.push(`<g pointer-events="none" aria-hidden="true">${overlay}</g>`);
  return out.join("");
}

function xTitle() {
  const planned = CONFIG.plans.some((g) => state.plans[g.key] !== g.options[0].id);
  return `${planned ? "Effective cost" : "Cost"} per task (USD${state.linear ? "" : ", log scale"})`;
}

/* ---------- Empty state ---------- */
function familiesWithData(metricId) {
  return [...state.data.families.values()]
    .filter((f) => (state.deprecated || !f.deprecated) && f.variants.some((v) => v.scores[metricId] != null))
    .map((f) => f.id);
}

function renderEmpty(m, show) {
  els.empty.hidden = !show;
  if (!show) return;
  const tab = m.metric.tab;
  let title;
  if (!state.selected.length) title = "No models selected";
  else if (!m.base.length) title = state.excluded.length ? "No reasoning levels enabled" : "No models to show";
  else if (!m.rows.length) title = `No ${tab} data for the selected models`;
  else title = `Only ${m.rows.length} selected model${m.rows.length === 1 ? " has" : "s have"} ${tab} data`;
  els.emptyTitle.textContent = title;
  els.emptyText.textContent = `The chart needs at least ${CONFIG.minChartPoints} models with data.`;
  els.emptyAction.textContent = `Show models with ${tab} data`;
  els.emptyAction.hidden = familiesWithData(m.metric.id).every((f) => state.selected.includes(f)) &&
    state.excluded.length === 0;
}

function showModelsWithData() {
  const add = familiesWithData(state.metric).filter((f) => !state.selected.includes(f));
  state.selected = [...state.selected, ...add];
  if (buildRows(state.data, state).rows.length < CONFIG.minChartPoints) state.excluded = [];
  update();
}

/* ---------- Tooltip ---------- */
function tooltipRows(r) {
  const v = r.v, metric = metricById(state.metric);
  const plan = planFor(v, state.plans);
  const rows = [{ key: "score", label: metric.axis, value: r.y, text: fmtScore(r.y), note: livebenchNote(v, metric) }];
  rows.push({ key: "cost", label: plan ? `Cost per task (${plan.fullName})` : "Cost per task", value: r.x, text: fmtCost(r.x) });
  if (plan) rows.push({ key: "api", label: "API cost per task", value: v.cost, text: fmtCost(v.cost) });
  rows.push({ key: "time", label: "Response time", value: v.time, text: fmtSeconds(v.time) });
  rows.push({ key: "speed", label: "Output speed", value: v.speed, text: fmtSpeed(v.speed) });
  return rows;
}
function livebenchNote(v, metric) {
  const meta = v.livebench, count = meta?.subtasks?.[metric.id];
  if (!metric.livebench || !meta || !count) return "";
  return `${meta.release} · ${meta.source_model} · ${count.completed}/${count.expected} subtasks`;
}

function renderTooltip(m) {
  const tip = els.tooltip;
  const r = m && m.active;
  if (!r) { tip.hidden = true; setHTML(tip, ""); return; }
  tip.hidden = false;
  tip.className = "chart-tooltip scatter-tooltip" + (m.pinned ? " pinned" : "") + (m.comparing ? " comparing" : "");
  const color = familyColor(r.family, r.v.lab, state.theme);
  let html = `<div class="tooltip-head"><strong>${labMark(r.v.lab, r.v.labName, 18)}<span style="color:${color}">${esc(r.v.name)}</span></strong>` +
    `<button type="button" data-key="close" aria-label="Close details">${icon("close", 14)}</button></div>` +
    `<p>${esc(r.v.effortLabel)}${r === m.pinned ? " · Pinned" : ""}</p>`;
  if (m.comparing) {
    const a = m.pinned, h = m.hovered;
    const ra = tooltipRows(a), rh = tooltipRows(h);
    const keys = [...new Set([...ra, ...rh].map((x) => x.key))];
    const find = (list, k) => list.find((x) => x.key === k);
    html += `<div class="comparison-reference">${labMark(a.v.lab, a.v.labName, 14)}vs ${esc(a.v.name)} · ${esc(a.v.effortLabel)}</div>` +
      `<table class="comparison-table"><thead><tr><th><span class="sr-only">Metric</span></th><th>Selected</th><th>Hovered</th><th>Multiplier</th></tr></thead><tbody>` +
      keys.map((k) => {
        const x = find(ra, k), y = find(rh, k);
        const label = k === "cost" ? "Cost per task" : (x || y).label;
        return `<tr><th>${esc(label)}</th><td>${x ? x.text : "—"}</td><td>${y ? y.text : "—"}</td><td>${fmtMult(y?.value, x?.value)}</td></tr>`;
      }).join("") + "</tbody></table>";
  } else {
    html += tooltipRows(r).map((x) =>
      `<div class="tooltip-value"><span>${esc(x.label)}</span><b>${x.text}${x.note ? `<small>${esc(x.note)}</small>` : ""}</b></div>`).join("");
  }
  html += `<a href="https://artificialanalysis.ai/models/${encodeURIComponent(r.id)}" target="_blank" rel="noreferrer">Artificial Analysis</a>`;
  setHTML(tip, html);
}

/* ---------- Render and URL ---------- */
function syncUrl() {
  const search = encodeUrl(state, location.search);
  if (search !== location.search) history.replaceState(null, "", location.pathname + search + location.hash);
}
function update() {
  renderHeader();
  renderToolbar();
  renderSidebar();
  renderChart();
  syncUrl();
}

/* ---------- Theme ---------- */
const themeQuery = matchMedia("(prefers-color-scheme: light)");
function storedTheme() {
  try { return localStorage.getItem("theme"); } catch (e) { return null; }
}
function applyTheme(theme) {
  state.theme = theme;
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#ffffff" : "#000000";
  renderHeader();
  renderChart();
}
els.theme.addEventListener("click", () => {
  const theme = state.theme === "light" ? "dark" : "light";
  try { localStorage.setItem("theme", theme); } catch (e) { /* storage blocked */ }
  applyTheme(theme);
});
themeQuery.addEventListener("change", () => {
  const stored = storedTheme();
  if (stored !== "light" && stored !== "dark") applyTheme(themeQuery.matches ? "light" : "dark");
});

/* ---------- Controls ---------- */
els.tabs.addEventListener("click", (e) => {
  const id = e.target.closest("button[data-key]")?.dataset.key;
  if (!id || id === state.metric) return;
  state.metric = id;
  update();
});
els.pareto.addEventListener("click", () => { state.frontier = !state.frontier; update(); });
els.linear.addEventListener("click", () => { state.linear = true; update(); });
els.log.addEventListener("click", () => { state.linear = false; update(); });
els.zoom.addEventListener("click", () => { state.zoomY = !state.zoomY; update(); });
els.deprecated.addEventListener("click", () => { state.deprecated = !state.deprecated; update(); });
els.emptyAction.addEventListener("click", showModelsWithData);

els.reset.addEventListener("click", () => {
  const d = CONFIG.defaults;
  Object.assign(state, { selected: [...d.selected], excluded: [...d.excluded], frontier: d.frontier,
    linear: d.linear, labels: d.labels, zoomY: false, highlights: [], hovered: null, pinned: null, labelHover: null });
  update();
});
els.efforts.addEventListener("click", (e) => {
  const effort = e.target.closest("button[data-key]")?.dataset.key;
  if (!effort) return;
  state.excluded = state.excluded.includes(effort)
    ? state.excluded.filter((x) => x !== effort) : [...state.excluded, effort];
  update();
});
els.plans.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-plan]");
  if (!b) return;
  state.plans = { ...state.plans, [b.dataset.group]: b.dataset.plan };
  update();
});

els.slider.addEventListener("input", () => {
  state.maxTime = sliderToSeconds(+els.slider.value, CONFIG.sliderSteps, state.data.timeRange);
  renderTimeFilter();
  renderChart();
  syncUrl();
});
// A horizontal touchpad swipe over the slider or the chart nudges the slider by one step.
// Mostly vertical scrolling is left alone.
function nudgeOnHorizontalWheel(e) {
  if (!state.data || !e.deltaX || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();
  const value = Math.min(CONFIG.sliderSteps, Math.max(0, +els.slider.value + (e.deltaX > 0 ? 1 : -1)));
  if (value === +els.slider.value) return;
  els.slider.value = value;
  els.slider.dispatchEvent(new Event("input", { bubbles: true }));
}
els.slider.addEventListener("wheel", nudgeOnHorizontalWheel, { passive: false });
els.svg.addEventListener("wheel", nudgeOnHorizontalWheel, { passive: false });

/* ---------- Chart interaction ---------- */
const pointOf = (target) => target.closest?.("[data-id]")?.dataset.id ?? null;
const labelOf = (target) => target.closest?.("[data-label]")?.dataset.label ?? null;
function setHover(id, family) {
  if (state.hovered === id && state.labelHover === family) return;
  state.hovered = id;
  state.labelHover = family;
  renderChart();
}
function togglePin(id) {
  state.pinned = state.pinned === id ? null : id;
  state.hovered = null;
  renderChart();
}
function toggleHighlight(family) {
  state.highlights = state.highlights.includes(family)
    ? state.highlights.filter((f) => f !== family) : [...state.highlights, family];
  renderChart();
}
els.svg.addEventListener("pointerover", (e) => setHover(pointOf(e.target), labelOf(e.target)));
els.svg.addEventListener("pointerleave", () => setHover(null, null));
els.svg.addEventListener("focusin", (e) => { if (!chartRendering) setHover(pointOf(e.target), labelOf(e.target)); });
els.svg.addEventListener("focusout", (e) => {
  if (!chartRendering && !els.svg.contains(e.relatedTarget)) setHover(null, null);
});
els.svg.addEventListener("click", (e) => {
  const id = pointOf(e.target), family = labelOf(e.target);
  if (id) togglePin(id);
  else if (family) toggleHighlight(family);
});
els.svg.addEventListener("keydown", (e) => {
  const id = pointOf(e.target), family = labelOf(e.target);
  if (e.key === "Enter" || e.key === " ") {
    if (!id && !family) return;
    e.preventDefault();
    if (id) togglePin(id); else toggleHighlight(family);
  } else if (e.key === "Escape" && id && state.pinned) {
    state.pinned = null;
    renderChart();
  }
});
els.tooltip.addEventListener("click", (e) => {
  if (!e.target.closest('button[data-key="close"]')) return;
  state.pinned = state.hovered = null;
  renderChart();
});
window.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!state.pinned && !state.hovered && !state.labelHover && !state.highlights.length) return;
  Object.assign(state, { pinned: null, hovered: null, labelHover: null, highlights: [] });
  renderChart();
});

/* ---------- Size ---------- */
const compactQuery = matchMedia("(max-width: 900px)");
state.compact = compactQuery.matches;
compactQuery.addEventListener("change", () => { state.compact = compactQuery.matches; renderChart(); });
new ResizeObserver(([entry]) => {
  const width = Math.floor(entry.contentRect.width), height = Math.floor(entry.contentRect.height);
  if (width === state.size.width && height === state.size.height) return;
  state.size = { width, height };
  renderChart();
}).observe(els.canvas);

/* ---------- Load ---------- */
document.getElementById("brand").href = location.pathname;
renderHeader();
renderToolbar();
fetch("models.json")
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then((models) => {
    state.data = normalise(models);
    const known = { families: new Set(state.data.families.keys()), efforts: new Set(Object.keys(CONFIG.efforts)) };
    Object.assign(state, decodeUrl(location.search, known));
    update();
  })
  .catch((err) => {
    els.empty.hidden = false;
    els.emptyTitle.textContent = "Could not load models.json";
    els.emptyText.textContent = `${err.message}. Serve this folder over HTTP, for example with ` +
      "python3 -m http.server, and open the page through http://, not file://.";
    els.emptyAction.hidden = true;
    console.error(err);
  });

// Pure helpers for tests (page.evaluate).
window.__chart = {
  CONFIG, state, fmtCost, fmtScore, fmtSeconds, fmtSpeed, fmtMult, shortName, effortText,
  normalise, familyColor, planFor, effectiveCost, sliderToSeconds, secondsToSlider,
  geometry, xDomain, yDomain, linearScale, logScale, niceTicks, logTicks, paretoSet,
  layoutLabels, buildRows, chartModel, decodeUrl, encodeUrl,
};
</script>
</body>
</html>
